<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Differenzialdiagnosen: Reise &amp; Infektiologie</title>
<style>
:root{
  --nv:#0f172a;
  --tl:#0d9488;
  --tl2:#ccfbf1;
  --bg:#eef2f6;
  --cd:#ffffff;
  --mu:#475569;
  --ln:#e2e8f0;
  --rd:#b91c1c;
  --rd2:#fee2e2;
  --am:#92400e;
  --am2:#fef3c7;
  --in:#1e3a8a;
  --in2:#eff6ff;
  --ok:#065f46;
  --ok2:#d1fae5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--nv);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:16px}
#pa-tropen-ddx-filter{
  background:var(--cd);
  border:1px solid var(--ln);
  border-radius:16px;
  overflow:hidden;
  max-width:1080px;
  margin:0 auto;
  text-align:left;
  box-shadow:0 8px 28px rgba(15,23,42,.06);
}
#pa-tropen-ddx-filter .hd{
  background:linear-gradient(135deg,#0f172a 0%,#134e4a 100%);
  color:#fff;
  padding:22px 20px;
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  align-items:center;
  justify-content:space-between;
}
#pa-tropen-ddx-filter .hd-main{display:flex;gap:16px;align-items:center;flex:1 1 420px}
#pa-tropen-ddx-filter .hd svg{flex:none;width:46px;height:46px}
#pa-tropen-ddx-filter .hd h1{margin:0 0 4px;font-size:21px;line-height:1.2;color:#fff}
#pa-tropen-ddx-filter .hd p{margin:0;color:#cbd5e1;font-size:13.5px}
#pa-tropen-ddx-filter .lang-sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#pa-tropen-ddx-filter .lb{
  background:rgba(255,255,255,.12);
  color:#f8fafc;
  border:1.5px solid rgba(255,255,255,.32);
  border-radius:999px;
  padding:6px 12px;
  font-size:13px;
  font-weight:600;
}
#pa-tropen-ddx-filter .lb:hover{background:rgba(255,255,255,.22)}
#pa-tropen-ddx-filter .lb[aria-pressed=true]{
  background:#fff;
  color:#0f172a;
  border-color:#fff;
}
#pa-tropen-ddx-filter .bd{padding:16px;background:var(--bg)}
#pa-tropen-ddx-filter .warn{
  background:var(--rd2);
  border-left:8px solid var(--rd);
  color:#7f1d1d;
  padding:12px 16px;
  border-radius:10px;
  margin-bottom:14px;
  font-size:13.5px;
}
#pa-tropen-ddx-filter .warn[hidden]{display:none}
#pa-tropen-ddx-filter .g{
  background:var(--cd);
  border:1px solid var(--ln);
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}
#pa-tropen-ddx-filter .g h2{
  margin:0 0 12px;
  font-size:15.5px;
  color:var(--nv);
  display:flex;
  align-items:center;
  gap:8px;
}
#pa-tropen-ddx-filter .g h2 i{
  font-style:normal;
  background:var(--tl2);
  border-radius:8px;
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
}
#pa-tropen-ddx-filter .g h3{margin:14px 0 8px;font-size:12.5px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
#pa-tropen-ddx-filter .ch{display:flex;flex-wrap:wrap;gap:8px}
#pa-tropen-ddx-filter .c{
  background:#fff;
  color:var(--nv);
  border:1.5px solid #94a3b8;
  border-radius:24px;
  padding:7px 13px;
  font-size:13px;
  line-height:1.25;
  text-align:left;
  transition:background .15s,color .15s,border-color .15s;
}
#pa-tropen-ddx-filter .c[aria-pressed=true]{
  background:var(--tl);
  border-color:var(--tl);
  color:#fff;
  font-weight:600;
}
#pa-tropen-ddx-filter .c.tf[aria-pressed=true]{
  background:var(--rd);
  border-color:var(--rd);
  color:#fff;
}
#pa-tropen-ddx-filter .c:focus-visible,
#pa-tropen-ddx-filter .pb:focus-visible,
#pa-tropen-ddx-filter .lb:focus-visible,
#pa-tropen-ddx-filter summary:focus-visible{outline:3px solid var(--nv);outline-offset:2px}
#pa-tropen-ddx-filter .ctrl-bar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:4px 0 16px;
  align-items:center;
}
#pa-tropen-ddx-filter button{font:inherit;cursor:pointer}
#pa-tropen-ddx-filter .pb.rs{
  background:#fff;
  color:var(--nv);
  border:2px solid var(--nv);
  border-radius:24px;
  padding:8px 16px;
  font-size:13.5px;
  font-weight:700;
}
#pa-tropen-ddx-filter .pb.mode{
  background:#f1f5f9;
  color:var(--nv);
  border:1.5px solid #94a3b8;
  border-radius:24px;
  padding:8px 14px;
  font-size:13px;
  font-weight:600;
}
#pa-tropen-ddx-filter .pb.mode[aria-pressed=true]{
  background:var(--nv);
  color:#fff;
  border-color:var(--nv);
}
#pa-tropen-ddx-filter .sub-panel{
  background:#fff;
  border:1px solid var(--ln);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:14px;
}
#pa-tropen-ddx-filter .sub-panel.rf-panel{
  border-left:6px solid var(--rd);
}
#pa-tropen-ddx-filter .sub-panel.ctx-panel{
  border-left:6px solid var(--tl);
}
#pa-tropen-ddx-filter .sub-panel h2{margin:0 0 6px;font-size:15px;color:var(--nv)}
#pa-tropen-ddx-filter .sub-panel p.sub-desc{margin:0 0 10px;font-size:12.5px;color:var(--mu)}
#pa-tropen-ddx-filter .ctx-note{
  margin-top:10px;
  padding:10px 12px;
  border-radius:8px;
  background:#f8fafc;
  border:1px solid var(--ln);
  font-size:13px;
}
#pa-tropen-ddx-filter .ctx-note[hidden]{display:none}
#pa-tropen-ddx-filter .sm-wrap{margin:12px 0 12px}
#pa-tropen-ddx-filter .sm{font-size:14px;color:var(--nv);margin:0 0 2px;font-weight:700}
#pa-tropen-ddx-filter .sm-note{font-size:12px;color:var(--mu);margin:0}

#pa-tropen-ddx-filter .main-grid{
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(270px,0.9fr);
  gap:16px;
  align-items:start;
}
#pa-tropen-ddx-filter .ampel-card{
  position:sticky;
  top:12px;
  background:#fff;
  border:1px solid var(--ln);
  border-radius:16px;
  padding:16px;
  box-shadow:0 4px 16px rgba(15,23,42,.04);
}
#pa-tropen-ddx-filter .ampel-card h2{
  margin:0 0 10px;
  font-size:15.5px;
  color:var(--nv);
}
#pa-tropen-ddx-filter .ampel-visual{
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px;
  border-radius:12px;
  background:#f8fafc;
  border:1px solid var(--ln);
  margin-bottom:12px;
}
#pa-tropen-ddx-filter .traffic-light{
  display:flex;
  flex-direction:column;
  gap:6px;
  background:#1e293b;
  padding:8px;
  border-radius:12px;
  flex:none;
}
#pa-tropen-ddx-filter .bulb{
  width:18px;
  height:18px;
  border-radius:50%;
  opacity:.22;
  transition:opacity .15s,transform .15s,box-shadow .15s;
}
#pa-tropen-ddx-filter .bulb.red{background:#ef4444}
#pa-tropen-ddx-filter .bulb.yellow{background:#f59e0b}
#pa-tropen-ddx-filter .bulb.green{background:#10b981}
#pa-tropen-ddx-filter .bulb.on{
  opacity:1;
  transform:scale(1.1);
  box-shadow:0 0 10px currentColor;
}
#pa-tropen-ddx-filter .ampel-badge{
  display:inline-block;
  font-size:11.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:3px 9px;
  border-radius:999px;
  margin-bottom:4px;
}
#pa-tropen-ddx-filter .ampel-title{font-size:15px;font-weight:800;line-height:1.25;margin:0}
#pa-tropen-ddx-filter .ampel-body{font-size:13px;line-height:1.45;color:var(--nv);margin:0 0 10px}
#pa-tropen-ddx-filter .ampel-list{
  margin:0;
  padding-left:16px;
  font-size:12.5px;
  color:var(--mu);
}
#pa-tropen-ddx-filter .ampel-list li{margin-bottom:4px}
#pa-tropen-ddx-filter .lv-green .ampel-badge{background:var(--ok2);color:var(--ok)}
#pa-tropen-ddx-filter .lv-green .ampel-visual{background:#ecfdf5;border-color:#a7f3d0}
#pa-tropen-ddx-filter .lv-yellow .ampel-badge{background:var(--am2);color:var(--am)}
#pa-tropen-ddx-filter .lv-yellow .ampel-visual{background:#fffbeb;border-color:#fde68a}
#pa-tropen-ddx-filter .lv-red .ampel-badge{background:var(--rd2);color:#7f1d1d}
#pa-tropen-ddx-filter .lv-red .ampel-visual{background:#fef2f2;border-color:#fecaca}
#pa-tropen-ddx-filter .lv-stakob .ampel-badge{background:#450a0a;color:#fef2f2}
#pa-tropen-ddx-filter .lv-stakob .ampel-visual{background:#450a0a;color:#fff;border-color:#7f1d1d}
#pa-tropen-ddx-filter .lv-stakob .ampel-title,
#pa-tropen-ddx-filter .lv-stakob .ampel-body{color:#fff}

#pa-tropen-ddx-filter .diff-box{
  background:#fff;
  border:1px solid #bae6fd;
  border-left:6px solid #0284c7;
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:16px;
}
#pa-tropen-ddx-filter .diff-box h2{margin:0 0 4px;font-size:15px;color:#0c4a6e}
#pa-tropen-ddx-filter .diff-pair{font-size:13px;font-weight:700;color:var(--nv);margin:0 0 8px}
#pa-tropen-ddx-filter .diff-box ul{margin:0;padding-left:18px;font-size:13px;color:var(--nv)}
#pa-tropen-ddx-filter .diff-box li{margin-bottom:4px}

#pa-tropen-ddx-filter .cd{
  background:var(--cd);
  border:1px solid var(--ln);
  border-top:8px solid var(--tl);
  border-radius:16px;
  padding:16px;
  margin-bottom:18px;
}
#pa-tropen-ddx-filter .cd.u{border-top-color:var(--rd)}
#pa-tropen-ddx-filter .th{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
#pa-tropen-ddx-filter .rk{
  display:inline-block;
  background:#e2e8f0;
  color:var(--nv);
  border-radius:6px;
  padding:2px 7px;
  font-size:12px;
  font-weight:700;
  margin-right:8px;
  vertical-align:middle;
}
#pa-tropen-ddx-filter .cd.u .rk{background:var(--rd2);color:#7f1d1d}
#pa-tropen-ddx-filter .cd h2{margin:0;font-size:19px;color:var(--nv);display:inline;vertical-align:middle}
#pa-tropen-ddx-filter .sc{font-size:13px;color:var(--mu);margin:4px 0 0;font-style:italic}
#pa-tropen-ddx-filter .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#pa-tropen-ddx-filter .ub{
  display:inline-block;
  background:var(--rd);
  color:#fff;
  border-radius:8px;
  padding:2px 8px;
  font-size:12px;
  font-weight:700;
}
#pa-tropen-ddx-filter .prio-tag{
  display:inline-block;
  background:#fef2f2;
  color:#991b1b;
  border:1px solid #fecaca;
  border-radius:8px;
  padding:2px 8px;
  font-size:12px;
  font-weight:600;
}
#pa-tropen-ddx-filter .rg-box{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
#pa-tropen-ddx-filter .rg{
  width:56px;
  height:56px;
  border-radius:50%;
  background:conic-gradient(var(--tl) var(--p),#e2e8f0 0);
  display:grid;
  place-items:center;
}
#pa-tropen-ddx-filter .cd.u .rg{background:conic-gradient(var(--rd) var(--p),#e2e8f0 0)}
#pa-tropen-ddx-filter .rg span{
  background:#fff;
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:12.5px;
  font-weight:700;
}
#pa-tropen-ddx-filter .rg-lbl{font-size:11px;color:var(--mu);font-weight:600;text-align:center;max-width:76px;line-height:1.2}
#pa-tropen-ddx-filter .pl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 8px}
#pa-tropen-ddx-filter .pi{
  border-radius:8px;
  padding:7px 0;
  text-align:center;
  font-size:11.5px;
  border:2px dashed #cbd5e1;
  color:var(--mu);
  background:#f8fafc;
}
#pa-tropen-ddx-filter .pi b{display:block;font-size:17px;line-height:1.2}
#pa-tropen-ddx-filter .pi.y{background:var(--tl);border:2px solid var(--tl);color:#fff}
#pa-tropen-ddx-filter .pi.w{background:var(--am2);border:2px solid #f59e0b;color:var(--am)}
#pa-tropen-ddx-filter .wy{background:var(--bg);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:13.5px}
#pa-tropen-ddx-filter .wy b{display:block;margin-bottom:6px}
#pa-tropen-ddx-filter .wy ul{margin:0;padding:0;list-style:none}
#pa-tropen-ddx-filter .wy li{padding:0 0 6px 22px;position:relative}
#pa-tropen-ddx-filter .wy li:last-child{padding-bottom:0}
#pa-tropen-ddx-filter .wy li:before{position:absolute;left:0;content:"\25CB";color:var(--mu)}
#pa-tropen-ddx-filter .wy li.y:before{content:"\2713";color:var(--tl);font-weight:700}
#pa-tropen-ddx-filter .wy li.w:before{content:"\25B3";color:var(--am)}
#pa-tropen-ddx-filter .wy li.w{color:var(--am)}
#pa-tropen-ddx-filter .tl{margin:12px 0 8px}
#pa-tropen-ddx-filter .tl>b{font-size:13.5px;display:block;margin-bottom:6px}
#pa-tropen-ddx-filter .tr{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
#pa-tropen-ddx-filter .tr div{height:22px;border-radius:4px;background:#e2e8f0}
#pa-tropen-ddx-filter .tr div.t{background:var(--tl)}
#pa-tropen-ddx-filter .tr div.a{background:repeating-linear-gradient(45deg,#5eead4,#5eead4 4px,#ccfbf1 4px,#ccfbf1 8px)}
#pa-tropen-ddx-filter .tr div.s{box-shadow:0 0 0 3px var(--nv)}
#pa-tropen-ddx-filter .tx{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px;font-size:11px;color:var(--mu);text-align:center}
#pa-tropen-ddx-filter .lg{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--mu);margin-top:6px}
#pa-tropen-ddx-filter .lg i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle;background:#e2e8f0}
#pa-tropen-ddx-filter .lg i.t{background:var(--tl)}
#pa-tropen-ddx-filter .lg i.a{background:repeating-linear-gradient(45deg,#5eead4,#5eead4 3px,#ccfbf1 3px,#ccfbf1 6px)}
#pa-tropen-ddx-filter .lg i.s{background:#fff;box-shadow:0 0 0 2px var(--nv)}
#pa-tropen-ddx-filter .fv{background:var(--am2);color:var(--am);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:13.5px;display:flex;gap:14px;align-items:center}
#pa-tropen-ddx-filter .fv svg{flex:none;width:92px;height:30px}
#pa-tropen-ddx-filter .fv-meta{margin:4px 0 0;font-size:12px;color:#78350f;line-height:1.4}
#pa-tropen-ddx-filter .lab-box{
  background:#f8fafc;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:10px 14px;
  margin:8px 0;
  font-size:13px;
}
#pa-tropen-ddx-filter .lab-box b{display:block;color:var(--nv);margin-bottom:4px}
#pa-tropen-ddx-filter details{margin-top:8px;border-top:1px solid var(--ln);padding-top:8px}
#pa-tropen-ddx-filter summary{cursor:pointer;font-weight:700;padding:6px 0;font-size:14px}
#pa-tropen-ddx-filter .ns p{margin:0 0 8px;font-size:13px;padding:9px 12px;border-radius:8px;border-left:4px solid var(--tl);background:#f0fdfa}
#pa-tropen-ddx-filter .ns p.h{background:var(--in2);border-left-color:#2563eb;color:var(--in)}
#pa-tropen-ddx-filter .ns p.k{background:var(--rd2);border-left-color:var(--rd);color:#7f1d1d}
#pa-tropen-ddx-filter .ns p.m{background:#f8fafc;border-left-color:#475569;color:var(--nv)}
#pa-tropen-ddx-filter .ns p.g-src{background:#f0fdf4;border-left-color:#15803d;color:#14532d}
#pa-tropen-ddx-filter .more-btn{
  display:block;
  width:100%;
  background:#fff;
  color:var(--nv);
  border:2px dashed #94a3b8;
  border-radius:12px;
  padding:11px 16px;
  font-size:13.5px;
  font-weight:700;
  margin-bottom:16px;
}
#pa-tropen-ddx-filter .more-btn:hover{background:#f8fafc;border-color:var(--nv)}
#pa-tropen-ddx-filter .ft{font-size:12px;color:var(--mu);padding:12px 20px 20px;background:var(--cd);border-top:1px solid var(--ln)}
@media (max-width:860px){
  #pa-tropen-ddx-filter .main-grid{grid-template-columns:1fr}
  #pa-tropen-ddx-filter .ampel-card{position:static}
}
@media (max-width:640px){
  body{padding:8px}
  #pa-tropen-ddx-filter .hd h1{font-size:19px}
  #pa-tropen-ddx-filter .pi{font-size:11px}
  #pa-tropen-ddx-filter .fv{flex-direction:column;align-items:flex-start}
}
</style>
<main id="pa-tropen-ddx-filter">
  <header class="hd">
    <div class="hd-main">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#0d9488"/><path d="M6 26h9l4-10 7 18 5-12 3 4h8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <h1 id="pa-title">Differenzialdiagnosen: Reise &amp; Infektiologie</h1>
        <p id="pa-sub">Erst filtern, dann unten Kontext &amp; Red Flags prüfen – rechts zeigt die Ampel die Einweisungsrichtung.</p>
      </div>
    </div>
    <div class="lang-sw" id="pa-lang" role="group" aria-label="Sprache / Language">
      <button type="button" class="lb" data-l="de" aria-pressed="true">DE</button>
      <button type="button" class="lb" data-l="en" aria-pressed="false">EN</button>
      <button type="button" class="lb" data-l="es" aria-pressed="false">ES</button>
      <button type="button" class="lb" data-l="pt" aria-pressed="false">PT</button>
    </div>
  </header>
  <div class="bd">
    <div class="warn" id="pa-w" hidden></div>
    <div id="pa-f"></div>
    <div class="ctrl-bar" id="pa-p"></div>
    <div id="pa-ctx"></div>
    <div id="pa-triage"></div>
    <div class="sm-wrap">
      <p class="sm" id="pa-n"></p>
      <p class="sm-note" id="pa-note"></p>
    </div>
    <div class="main-grid">
      <div class="results-col">
        <div id="pa-diff"></div>
        <div id="pa-r"></div>
      </div>
      <aside class="ampel-card" id="pa-ampel" aria-live="polite"></aside>
    </div>
  </div>
  <footer class="ft" id="pa-ft"></footer>
</main>
<script>
(function(){
var R=document.getElementById("pa-tropen-ddx-filter");
var $=function(s){return R.querySelector(s)};
var lang="de";
var showAll=false;
var B={b0:[0,3],b1:[4,7],b2:[8,14],b3:[15,30],b4:[42,84],b5:[91,99999]};
var BL=["0–3 d","4–7 d","8–14 d","15–30 d","6–12 w","> 3 m"];

var UI={
de:{
  docTitle:"Differenzialdiagnosen: Reise & Infektiologie",
  title:"Differenzialdiagnosen: Reise & Infektiologie",
  sub:"Erst filtern, dann unten Kontext & Red Flags prüfen – rechts zeigt die Ampel die Einweisungsrichtung.",
  warn:"<b>Fieber nach Aufenthalt im Endemiegebiet:</b> Malaria zuerst als Notfall abklären (Dicker Tropfen, Ausstrich, Schnelltest; bei negativem Erstbefund nach 12–24 h wiederholen). Bei Dengue-/Arbovirose-Verdacht <b>kein ASS und keine NSAR</b>.",
  reset:"Filter zurücksetzen",
  top2Btn:"Fokus: Max. 2 Top-Treffer",

var DIFF_CLUES={
de:[
  "<b>Malaria vs. Dengue/Chikungunya/Zika:</b> Malaria sofort als Notfall ausschließen. Dengue zeigt um Tag 3–7 oft Warnzeichen/Plasma-Leck (Hämatokrit↑, Thrombozyten↓), Chikungunya ausgeprägte symmetrische Arthralgien, Zika eher milden Verlauf/Exanthem/Konjunktivitis.",

  "<b>Sepsis / Meningokokken / VHF:</b> Foudroyante Verläufe, Petechien/Purpura, Schock oder ZNS-Zeichen erfordern sofortige Notfall-/Klinik- bzw. STAKOB-Koordination."
],
en:[
  "<b>Malaria vs. Dengue/Chikungunya/Zika:</b> Rule out malaria first as an emergency. Dengue may show day 3–7 warning signs/plasma leakage (hematocrit↑, platelets↓), chikungunya prominent symmetric arthralgia, Zika milder course/rash/conjunctivitis.",
  "<b>Typhoid vs. Brucellosis/Relapsing Fever/Visceral Leishmaniasis:</b> Typhoid = stepwise rise, relative bradycardia; brucellosis = undulant with night sweats; relapsing fever = recurrent bouts with afebrile intervals; visceral leishmaniasis = insidious, hepatosplenomegaly, pancytopenia.",
  "<b>Sepsis / Meningococcal / VHF:</b> Fulminant course, petechiae/purpura, shock, or CNS signs require immediate emergency/hospital or STAKOB coordination."
],
es:[
  "<b>Malaria vs. Dengue/Chikungunya/Zika:</b> Descartar primero malaria como urgencia. Dengue puede presentar signos de alarma ~días 3–7 (hematocrito↑, plaquetas↓), chikungunya artralgias intensas, Zika curso más leve/exantema/conjuntivitis.",
  "<b>Tifoidea vs. Brucelosis/Fiebre recurrente/Leishmaniasis visceral:</b> Tifoidea = ascenso escalonado, bradicardia relativa; brucelosis = ondulante con sudoración nocturna; fiebre recurrente = brotes con intervalos afebriles; leishmaniasis visceral = insidiosa, hepatoesplenomegalia, pancitopenia.",
  "<b>Sepsis / Meningococo / FHD:</b> Evolución fulminante, petequias/púrpura, shock o signos de SNC exigen coordinación urgente o de referencia."
],
pt:[
  "<b>Malária vs. Dengue/Chikungunya/Zika:</b> Descartar malária primeiro como emergência. Dengue pode ter sinais de alarme ~dias 3–7 (hematócrito↑, plaquetas↓), chikungunya artralgia intensa, Zika quadro mais leve/exantema/conjuntivite.",

  "<b>Sepse / Meningococo / FHD:</b> Evolução fulminante, petéquias/púrpura, choque ou sinais de SNC exigem coordenação urgente ou de referência."

  if(topResults.some(function(e){return !!e[0].u})&&(S.y.fh||S.y.bw||S.y.pe||S.y.zn||S.y.ik))return "yellow";

function ov(a,b){return a[0]<=b[1]&&b[0]<=a[1]}
function nm(a){return a.map(function(i){return optName(i)}).join(", ")}

function ev(d){
  var u=T();
  var o={ok:true,li:[],sc:0,maxSc:0,act:0,fitPts:0,fw:"",st:{t:"n",r:"n",y:"n",x:"n",v:"n"}};
  var r=d.r.split(" "),y=d.y.split(" "),x=d.x.split(" "),v=d.v.split(" "),f=d.f.split(" ");
  var inc=d.i[lang]||d.i.de, pat=d.p[lang]||d.p.de, dName=d.n[lang]||d.n.de;

  if(S.y.fn&&d.f.indexOf("fn")<0&&(dName=="Malaria"||dName=="Malária"||dName.indexOf("Dengue")>-1||dName=="Chikungunya"||dName=="Gelbfieber"||dName=="Yellow Fever"||dName=="Fiebre amarilla"||dName=="Febre amarela")){
    o.ok=false;
    return o;
  }

  var w=ks("t").map(function(i){return B[i]});
  if(w.length){
    o.act++;o.maxSc+=30;
    var ty=w.some(function(q){return ov(q,d.t)}),to=w.some(function(q){return ov(q,d.a)});
    if(ty){o.sc+=30;o.fitPts+=30;o.st.t="y";o.li.push(["y",u.timeTyp(inc)])}
    else if(to){o.sc+=12;o.fitPts+=12;o.st.t="w";o.li.push(["w",u.timeAll(inc)])}
    else o.ok=false;
  }else o.li.push(["n",u.noTime]);

  var sr=ks("r");
  if(sr.length){
    o.act++;o.maxSc+=24;
    var nonWw=sr.filter(function(i){return i!="ww"});
    var mr=sr.filter(function(i){return i=="ww"||r.indexOf(i)>-1||r.indexOf("ww")>-1});
    if(mr.length){
      var rr=sr.filter(function(i){return i=="ww"||r.indexOf(i)>-1});
      var regPts=nonWw.length&&r.indexOf("ww")>-1&&rr.indexOf("ww")<0?14:24;
      o.sc+=regPts;o.fitPts+=regPts;o.st.r="y";
      o.li.push(["y",u.regMatch(nm(rr.length?rr:sr),r.indexOf("ww")>-1)]);
    }else o.ok=false;
  }else o.li.push(["n",u.noReg]);

  var sy=ks("y"),sf=sy.filter(function(i){return FV.indexOf(i)>-1}),sn=sy.filter(function(i){return FV.indexOf(i)<0});
  var vh=dName.indexOf("Hämorrhagische")>-1||dName.indexOf("Hemorrhagic")>-1||dName.indexOf("Hemorrágicas")>-1||dName.indexOf("Hemorrágicas")>-1;
  var hr=!!S.x.hr||!!S.tf.vhfHigh,vok=hr&&(S.y.fh||S.y.pe||S.y.bw||S.tf.vhfHigh);
  var sn2=vh&&!vok?sn.filter(function(i){return i!="du"&&i!="ba"}):sn;

  if(sn.length){
    o.act++;o.maxSc+=36;
    var m=sn2.filter(function(i){return y.indexOf(i)>-1});
    if(m.length){
      var ratio=m.length/sn.length;
      var symPts=Math.round(ratio*28+(m.length*3));
      if(symPts>36)symPts=36;
      o.sc+=symPts;o.fitPts+=symPts;
      o.st.y=m.length==sn.length?"y":"w";
      o.li.push([m.length==sn.length?"y":"w",u.symMatch(nm(m),m.length,sn.length)]);
    }else o.ok=false;
  }else if(!sf.length)o.li.push(["n",u.noSym]);

  if(sf.length){
    if(!sn.length){o.act++;o.maxSc+=16}
    var mf=sf.filter(function(i){return f.indexOf(i)>-1});
    if(mf.length){
      if(!sn.length){o.fitPts+=16;o.st.y="y"}
      o.sc+=16;o.fw=u.fvFit(pat);
    }else{
      if(!sn.length){o.fitPts+=3;o.st.y="w"}
      else if(o.st.y=="y"){o.st.y="w"}
      o.sc+=2;o.fw=u.fvUnfit(pat);
    }
  }else o.fw=u.fvNone(pat);

  var sx=ks("x").filter(function(i){return i!="hr"});
  if(sx.length){
    o.act++;o.maxSc+=22;
    var mx=sx.filter(function(i){return x.indexOf(i)>-1});
    if(mx.length){o.sc+=22;o.fitPts+=22;o.st.x="y";o.li.push(["y",u.wayMatch(nm(mx))])}
    else o.ok=false;
  }else o.li.push(["n",u.noWay]);

  var sv=ks("v");
  if(sv.length){
    o.act++;o.maxSc+=10;
    var mv=sv.filter(function(i){return v.indexOf(i)>-1});
    if(mv.length){o.sc+=10;o.fitPts+=10;o.st.v="y";o.li.push(["y",u.tripMatch(nm(mv))])}
    else o.ok=false;
  }else o.li.push(["n",u.noTrip]);

  var hasZikaFeat=!!(S.y.ex||S.y.ar||S.y.ko);
  if((dName=="Malaria"||dName=="Malária")&&(S.y.fh||S.x.mu||sr.some(function(i){return i=="af"||i=="sa"||i=="la"||i=="ne"}))){
    o.sc+=14;o.fitPts+=8;o.maxSc+=8;
  }
  if(dName=="Zika"&&!hasZikaFeat&&(S.y.fh||S.y.gl||S.y.ba||S.y.du)){
    o.sc=Math.round(o.sc*.55);
    o.fitPts=Math.round(o.fitPts*.55);
    o.li.push(["w",u.malZikaNote]);
  }

  if(vh){
    if(vok){o.sc+=28;o.fitPts+=18;o.maxSc+=18;o.li.push(["y",u.vhHigh])}
    else{
      o.sc=Math.round(o.sc*.35);
      o.fitPts=Math.round(o.fitPts*.35);
      if(S.y.du||S.y.ba)o.li.push(["w",u.vhGI]);
      if(sf.length&&!hr)o.li.push(["w",u.vhLow]);
    }
  }
  return o;
}

function renderDiffBox(rs){

function calcFitPercent(o){
  if(!o.act||!o.maxSc)return null;
  var raw=Math.round((o.fitPts/o.maxSc)*95);
  return Math.max(10,Math.min(95,raw));
}

function render(){

      timeline(d)+
